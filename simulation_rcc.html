<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Simulation RCC</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="nav">
      <a href="rcc_param.html">Paramètres</a>
      <a href="simulation_rcc.html">Simulation</a>
    </div>

    <h1>Simulation RCC</h1>

    <table class="table">

      <tr>
        <td>Date de référence</td>
        <td>
          <input class="dynamic" type="date" id="refDate">
        </td>
      </tr>

      <tr>
        <td>Date de naissance</td>
        <td>
          <input class="dynamic" type="date" id="birthDate">
        </td>
      </tr>

      <tr>
        <td>Date d'entrée</td>
        <td>
          <input class="dynamic" type="date" id="entryDate">
        </td>
      </tr>

      <tr>
        <td>Salaire annuel brut</td>
        <td>
          <input class="dynamic" type="number" id="annualSalary">
        </td>
      </tr>

    </table>

    <button onclick="simulate()">Calculer</button>

    <h2>Résultats</h2>

    <table class="table">
      <tbody id="results"></tbody>
    </table>

  </div>

  <script src="rcc.js"></script>

  <script>

    function euro(value) {

      return new Intl.NumberFormat('fr-FR', {
        style: 'currency',
        currency: 'EUR'
      }).format(value);
    }

    function simulate() {

      const data = {
        refDate: document.getElementById('refDate').value,
        birthDate: document.getElementById('birthDate').value,
        entryDate: document.getElementById('entryDate').value,
        annualSalary: document.getElementById('annualSalary').value
      };

      const params = loadParams();

      const result = calculateRCC(data, params);

      document.getElementById('results').innerHTML = `

        <tr>
          <td>Age</td>
          <td class="result">${result.age.toFixed(2)} ans</td>
        </tr>

        <tr>
          <td>Ancienneté</td>
          <td class="result">${result.seniority.toFixed(2)} ans</td>
        </tr>

        <tr>
          <td>Salaire mensuel</td>
          <td class="result">${euro(result.monthlySalary)}</td>
        </tr>

        <tr>
          <td>Indemnité finale</td>
          <td class="result">${euro(result.indemniteFinale)}</td>
        </tr>

        <tr>
          <td>Durée dispositif</td>
          <td class="result">${result.duree} mois</td>
        </tr>

        <tr>
          <td>Rémunération mensuelle</td>
          <td class="result">${euro(result.remunerationMensuelle)}</td>
        </tr>

        <tr>
          <td>Rémunération totale</td>
          <td class="result">${euro(result.remunerationTotale)}</td>
        </tr>

        <tr>
          <td>Total global</td>
          <td class="result">${euro(result.totalGlobal)}</td>
        </tr>
      `;
    }

  </script>

</body>
</html>

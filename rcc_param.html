<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paramètres RCC</title>

<style>
body {
    font-family: "Segoe UI", Arial;
    background:#f5f7fa;
    padding:20px;
}

.container {
    max-width:900px;
    margin:auto;
}

.card {
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

.grid {
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
}

label {
    font-size:13px;
    color:#555;
}

input {
    width:100%;
    padding:6px;
    border-radius:6px;
    border:1px solid #ccc;
}

button {
    padding:10px 15px;
    border:none;
    border-radius:6px;
    background:#0a58ca;
    color:white;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="container">
<h2>Paramètres RCC</h2>

<div id="form"></div>

<button onclick="save()">💾 Enregistrer</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔑 CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCOXHEDdPKlGOV9_XaQlBp3RbEk0Lodi_8",
  authDomain: "simu-rcc.firebaseapp.com",
  projectId: "simu-rcc",
  storageBucket: "simu-rcc.firebasestorage.app",
  messagingSenderId: "35682807027",
  appId: "1:35682807027:web:3bed8a15cf650acfc95b86"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let params = {};

async function load() {
    const snap = await getDoc(doc(db, "rcc", "params"));
    params = snap.data();
    renderForm();
}

function renderForm() {

    const container = document.getElementById("form");
    container.innerHTML = "";

    for (let section in params) {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML += `<h3>${section}</h3>`;

        const grid = document.createElement("div");
        grid.className = "grid";

        for (let key in params[section]) {

            const value = params[section][key];

            const wrapper = document.createElement("div");

            wrapper.innerHTML = `
                <label>${key}</label>
                <input 
                    data-section="${section}" 
                    data-key="${key}" 
                    value="${value}" 
                    type="${typeof value === 'boolean' ? 'checkbox' : 'number'}"
                    ${typeof value === 'boolean' && value ? 'checked' : ''}
                >
            `;

            grid.appendChild(wrapper);
        }

        card.appendChild(grid);
        container.appendChild(card);
    }
}

async function save() {

    const inputs = document.querySelectorAll("input");
    const updated = {};

    inputs.forEach(input => {

        const section = input.dataset.section;
        const key = input.dataset.key;

        if (!updated[section]) updated[section] = {};

        if (input.type === "checkbox") {
            updated[section][key] = input.checked;
        } else {
            updated[section][key] = parseFloat(input.value);
        }
    });

    await setDoc(doc(db, "rcc", "params"), updated);

    alert("Paramètres sauvegardés !");
}

window.save = save;

load();

</script>

</body>
</html>

<div id="form"></div>

<script>

async function load() {
    const res = await fetch("params");
    const params = await res.json();

    const container = document.getElementById("form");
    container.innerHTML = "";

    for (let section in params) {

        const block = document.createElement("div");
        block.innerHTML = `<h3>${section}</h3>`;

        for (let key in params[section]) {

            const value = params[section][key];

            block.innerHTML += `
                <label>${key}</label>
                <input data-section="${section}" data-key="${key}" value="${value}">
                <br>
            `;
        }

        container.appendChild(block);
    }
}

async function save() {

    const inputs = document.querySelectorAll("input");
    const params = {};

    inputs.forEach(input => {
        const section = input.dataset.section;
        const key = input.dataset.key;

        if (!params[section]) params[section] = {};

        params[section][key] = parseFloat(input.value);
    });

    await fetch("http://localhost:3000/params", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(params)
    });

    alert("Sauvegardé !");
}

</script>

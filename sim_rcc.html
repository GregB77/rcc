<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Simulation RCC</title>

<style>
body {
    font-family: "Segoe UI", Arial;
    background:#f5f7fa;
    padding:20px;
}

.container {
    max-width:1000px;
    margin:auto;
}

.card {
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

table {
    width:100%;
    border-collapse:collapse;
}

td {
    padding:8px;
    border-bottom:1px solid #eee;
}

td.label {
    color:#555;
}

td.input input, td.input select {
    width:100%;
    padding:6px;
    background:#e8f2ff;
    border:1px solid #ccc;
    border-radius:5px;
}

td.value {
    text-align:right;
    font-weight:500;
}

.total {
    font-size:20px;
    font-weight:bold;
    color:#0a58ca;
}
</style>

</head>

<body>

<div class="container">
<div class="card">

<h2>Simulation RCC</h2>

<table>

<tr>
<td class="label">Date de référence</td>
<td class="input"><input type="date" id="date_ref"></td>
<td></td>
</tr>

<tr>
<td class="label">Date de naissance</td>
<td class="input"><input type="date" id="naissance"></td>
<td></td>
</tr>

<tr>
<td class="label">Date d'entrée</td>
<td class="input"><input type="date" id="entree"></td>
<td></td>
</tr>

<tr>
<td class="label">Salaire annuel</td>
<td class="input"><input type="number" id="salaire"></td>
<td></td>
</tr>

<tr>
<td class="label">Statut</td>
<td class="input">
<select id="statut">
<option>Cadre</option>
<option>Non cadre</option>
</select>
</td>
<td></td>
</tr>

<tr>
<td class="label">Dispositif</td>
<td class="input">
<select id="dispositif">
<option>CFC</option>
<option>Mobilité</option>
</select>
</td>
<td></td>
</tr>

<tr><td colspan="3"><strong>Résultats</strong></td></tr>

<tr><td class="label">Age</td><td></td><td id="age" class="value"></td></tr>
<tr><td class="label">Ancienneté</td><td></td><td id="anciennete" class="value"></td></tr>
<tr><td class="label">Salaire mensuel</td><td></td><td id="salaireM" class="value"></td></tr>
<tr><td class="label">Indemnité CFC</td><td></td><td id="ill" class="value"></td></tr>
<tr><td class="label">Indemnité Mobilité</td><td></td><td id="mobilite" class="value"></td></tr>
<tr><td class="label">Bonus âge</td><td></td><td id="bonus" class="value"></td></tr>
<tr><td class="label">Après plafond</td><td></td><td id="plafond" class="value"></td></tr>
<tr><td class="label">Minoration</td><td></td><td id="minoration" class="value"></td></tr>
<tr><td class="label">Résultat Mobilité</td><td></td><td id="resMob" class="value"></td></tr>
<tr><td class="label">Indemnité retenue</td><td></td><td id="retenue" class="value"></td></tr>
<tr><td class="label">Supra-légale</td><td></td><td id="supra" class="value"></td></tr>
<tr>
<td class="label total">TOTAL</td>
<td></td>
<td id="total" class="value total"></td>
</tr>

</table>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOXHEDdPKlGOV9_XaQlBp3RbEk0Lodi_8",
  authDomain: "simu-rcc.firebaseapp.com",
  projectId: "simu-rcc",
  storageBucket: "simu-rcc.firebasestorage.app",
  messagingSenderId: "35682807027",
  appId: "1:35682807027:web:3bed8a15cf650acfc95b86"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let params = {};

async function loadParams() {
    const snap = await getDoc(doc(db, "rcc", "params"));
    params = snap.data();
}

function yearsBetween(d1, d2) {
    return (new Date(d1) - new Date(d2)) / (365.25 * 24 * 3600 * 1000);
}

async function simulate() {

    if (!params.ill) await loadParams();

    const salaire = parseFloat(document.getElementById("salaire").value || 0);
    if (!salaire) return;

    const age = yearsBetween(
        document.getElementById("date_ref").value,
        document.getElementById("naissance").value
    );

    const anciennete = yearsBetween(
        document.getElementById("date_ref").value,
        document.getElementById("entree").value
    );

    const salaireM = salaire / 12;

    const ill = salaireM * (
        params.ill.taux_0_10 * Math.min(anciennete, 10) +
        params.ill.taux_10_plus * Math.max(anciennete - 10, 0)
    );

    let coef;
    if (anciennete < params.mobilite.seuil_cadre) {
        coef = params.ill.taux_0_10 * anciennete;
    } else {
        coef =
            params.mobilite.coeff_1 * params.mobilite.seuil_coeff +
            params.mobilite.coeff_2 * Math.max(anciennete - params.mobilite.seuil_coeff, 0);
    }

    let mobilite = salaireM * coef;

    let bonus = mobilite;

    if (age >= 50 && age < 55) {
        bonus = Math.max(
            mobilite * (1 + params.bonus_age.bonus_50_55),
            params.bonus_age.plancher_50_55 * salaireM
        );
    }

    if (age >= 55 && age < 60) {
        bonus = Math.max(
            mobilite * (1 + params.bonus_age.bonus_55_60),
            params.bonus_age.plancher_55_60 * salaireM
        );
    }

    let plafond = Math.min(bonus, params.plafonds.max_mois * salaireM);

    let reduction = 0;
    if (age >= 61) reduction = params.minoration.age_61;
    if (age >= 62) reduction = params.minoration.age_62;
    if (age >= 63) reduction = params.minoration.age_63;
    if (age >= 64) reduction = params.minoration.age_64;

    let resMob = plafond * (1 - reduction);

    let retenue = Math.max(ill, resMob);

    let supra = salaireM * Math.min(params.supra.coef_annee * anciennete, params.supra.coef_max);

    let total = retenue + supra;

    document.getElementById("age").innerText = age.toFixed(1);
    document.getElementById("anciennete").innerText = anciennete.toFixed(1);
    document.getElementById("salaireM").innerText = salaireM.toFixed(2);
    document.getElementById("ill").innerText = ill.toFixed(2);
    document.getElementById("mobilite").innerText = mobilite.toFixed(2);
    document.getElementById("bonus").innerText = bonus.toFixed(2);
    document.getElementById("plafond").innerText = plafond.toFixed(2);
    document.getElementById("minoration").innerText = (reduction * 100).toFixed(0) + "%";
    document.getElementById("resMob").innerText = resMob.toFixed(2);
    document.getElementById("retenue").innerText = retenue.toFixed(2);
    document.getElementById("supra").innerText = supra.toFixed(2);
    document.getElementById("total").innerText = total.toFixed(2) + " €";
}

document.querySelectorAll("input, select").forEach(el => {
    el.addEventListener("input", simulate);
});

</script>

</body>
</html>
